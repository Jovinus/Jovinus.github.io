# Representative peer-reviewed journal articles on the landing page (_includes/featured_papers.liquid),
# grouped by research theme. Keep in sync with `selected={true}` in _bibliography/papers.bib.
#
# The landing page shows one line per paper. Question, methods, data, and role live once, on the
# theme page (`url`, a _projects/ file) — do not copy them back here.
#
# - Year = the publisher's citation (volume) year, checked against Crossref.
# - `summary` is a single sentence paraphrasing the published abstract.

- theme: Real-World Evaluation
  url: /projects/real_world_evaluation/
  papers:
    - key: lee2026aki
      highlight: true
      title: "Deep learning models for acute kidney injury prediction: multi-center external validation and evaluation under simulated continuous monitoring conditions"
      journal: npj Digital Medicine
      year: 2026
      role: Co-first author
      doi: 10.1038/s41746-026-02722-2
      summary: Across 157,323 admissions at three sites, the model with the highest single-point AUROC carried the heaviest alert burden once its predictions were replayed every 12 hours.

- theme: Clinical Prediction
  url: /projects/clinical_prediction/
  papers:
    - key: kim2025validation
      title: "Validation of an artificial intelligence-based algorithm for predictive performance and risk stratification of sepsis using real-world data from hospitalised patients: a prospective observational study"
      journal: BMJ Health & Care Informatics
      year: 2025
      role: Co-first author
      doi: 10.1136/bmjhci-2024-101353
      summary: A deep learning sepsis score compared prospectively with conventional scoring systems in 6,455 hospitalised patients.

    - key: kang2023novel
      title: "Novel artificial intelligence-based technology to diagnose asthma using methacholine challenge tests"
      journal: Allergy, Asthma & Immunology Research
      year: 2024
      role: Co-first author
      doi: 10.4168/aair.2024.16.1.42
      code: https://github.com/Jovinus/Asthma_study
      summary: Reading the full spirometric response during a methacholine challenge, rather than the PC20 cut-off alone, to diagnose asthma in 1,501 patients.

- theme: Physiological Signal Learning
  url: /projects/physiological_signals/
  papers:
    - key: lee2025deep
      title: "Deep learning-based stress detection from RR intervals in major depressive disorder, panic disorder, and healthy individuals"
      journal: Frontiers in Psychiatry
      year: 2025
      role: Co-first author
      doi: 10.3389/fpsyt.2025.1672260
      code: https://github.com/Jovinus/HRV
      summary: Detecting acute cognitive stress from 1- and 5-minute raw RR-interval windows, without handcrafted HRV features.

    - key: lee2023age
      title: "Age prediction in healthy subjects using RR intervals and heart rate variability: A pilot study based on deep learning"
      journal: Applied Sciences
      year: 2023
      role: First author
      doi: 10.3390/app13052932
      code: https://github.com/Jovinus/Autonomic_Aging
      summary: Raw RR intervals matched HRV features for age-group prediction in 1,093 healthy adults, though no model separated every group reliably.

    - key: lee2021electromyogram
      title: "Electromyogram-based classification of hand and finger gestures using artificial neural networks"
      journal: Sensors
      year: 2022
      role: Co-first author
      doi: 10.3390/s22010225
      code: https://github.com/Bioelectronics-Laboratory/EMG_hand_finger_gestures_classification
      summary: Ten hand and finger gestures, seven of them single-finger, classified from three forearm EMG channels.
