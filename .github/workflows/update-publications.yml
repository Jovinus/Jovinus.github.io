name: Update Publications from Google Scholar

on:
  schedule:
    - cron: "0 0 1 1,4,7,10 *" # Quarterly: Jan 1, Apr 1, Jul 1, Oct 1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Save current papers.bib hash
        id: before
        run: |
          if [ -f _bibliography/papers.bib ]; then
            sha_before=$(sha256sum _bibliography/papers.bib | awk '{print $1}')
            echo "sha_before=$sha_before" >> $GITHUB_OUTPUT
          else
            echo "sha_before=none" >> $GITHUB_OUTPUT
          fi

      - name: Fetch new publications
        run: |
          timeout 300 python bin/update_scholar_publications.py

      - name: Save new papers.bib hash
        id: after
        run: |
          if [ -f _bibliography/papers.bib ]; then
            sha_after=$(sha256sum _bibliography/papers.bib | awk '{print $1}')
            echo "sha_after=$sha_after" >> $GITHUB_OUTPUT
          else
            echo "sha_after=none" >> $GITHUB_OUTPUT
          fi

      - name: Report changes
        run: |
          if [ "${{ steps.before.outputs.sha_before }}" != "${{ steps.after.outputs.sha_after }}" ]; then
            echo "New publications were added to papers.bib." >> $GITHUB_STEP_SUMMARY
          else
            echo "No new publications found." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Configure Git
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"

      - name: Commit and push if changed
        run: |
          git add _bibliography/papers.bib
          git diff --staged --quiet || (
            git commit -m "Update publications from Google Scholar"
            git push
          )
